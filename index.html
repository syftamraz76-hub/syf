<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">لعبة الغموض - نظام سهم المطور الشامل</title>
    <style>
        :root {
            --primary-red: #8B0000;
            --text-dark: #2D2D2D;
            --container-bg: rgba(255, 255, 255, 0.95);
            --gold: #D4AF37;
        }

        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-dark);
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: 0.5s;
        }

        .container {
            width: 95%;
            max-width: 750px;
            background: var(--container-bg);
            padding: 30px;
            border: 5px double var(--primary-red);
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin: 20px;
            border-radius: 15px;
            z-index: 10;
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
            border: 4px solid var(--primary-red);
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .logo-container img { width: 100%; height: 100%; object-fit: cover; }

        .screen { display: none; text-align: center; animation: fadeIn 0.5s ease-in-out; }
        .active { display: block; }

        h1, h2, h3 { color: var(--primary-red); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        
        button {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.3); filter: brightness(1.2); }
        button:active { transform: translateY(0); }

        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            font-size: 1rem;
            box-sizing: border-box;
        }

        .admin-panel { text-align: right; direction: rtl; max-height: 85vh; overflow-y: auto; padding-left: 10px; }
        .admin-section { 
            background: #f9f9f9; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            border-right: 8px solid var(--primary-red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .row-item { 
            background: white; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .row-controls { display: flex; justify-content: flex-end; gap: 5px; }

        .perm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px dashed var(--primary-red);
        }
        .perm-grid label { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; cursor: pointer; }
        .perm-grid input { width: auto; margin: 0; }

        .admin-badge {
            background: var(--gold);
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        video, canvas { width: 100%; max-width: 450px; border: 3px solid var(--primary-red); border-radius: 12px; margin: 15px 0; background: #000; }
        .signature-pad { border: 2px dashed #888; background: #fff; cursor: crosshair; }
        
        .audio-recorder {
            background: #eee;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
            border: 2px solid var(--primary-red);
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .floating-admin-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--primary-red);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            font-size: 1.5rem;
            border: 2px solid white;
        }
    </style>
</head>
<body>

<div class="container" id="main-app">
    <div class="logo-container">
        <img id="display-logo" src="https://via.placeholder.com/140" alt="Logo">
    </div>

    <!-- الشاشات -->
    <div id="screen-login" class="screen active">
        <h1>👤 دخول اللاعبين</h1>
        <input type="text" id="login-user" placeholder="اسم المستخدم">
        <input type="password" id="login-pass" placeholder="كلمة المرور">
        <button onclick="authPlayer()">دخول</button>
    </div>

    <div id="screen-admin-login" class="screen">
        <h1>🔐 لوحة المسؤولين</h1>
        <input type="text" id="admin-user-input" placeholder="اسم المسؤول">
        <input type="password" id="admin-pass-input" placeholder="كلمة السر">
        <button onclick="authAdmin()" style="background: #222;">تحقق من الصلاحيات</button>
        <button onclick="showScreen('screen-login')" style="background: #777;">رجوع</button>
    </div>

    <div id="screen-start" class="screen">
        <h1 id="start-title">مرحباً بك</h1>
        <p id="start-desc">أنت على وشك دخول منطقة الغموض..</p>
        <button onclick="showScreen('screen-rules')">التالي</button>
    </div>

    <div id="screen-rules" class="screen">
        <h1>📜 ميثاق اللعبة</h1>
        <div id="rules-content" style="text-align: right; padding: 0 20px;"></div>
        <button onclick="initGameSession()">أوافق وأبدأ التحدي</button>
    </div>

    <div id="screen-game" class="screen">
        <h2 id="q-title">السؤال</h2>
        <div id="q-interface"></div>
        <div id="q-controls" style="margin-top: 20px;">
            <button id="btn-next-q" onclick="processAnswer()">السؤال التالي</button>
        </div>
    </div>

    <div id="screen-finish" class="screen">
        <h1>✅ تمت المهمة</h1>
        <p>لقد تم إرسال بياناتك بنجاح إلى النظام.</p>
        <button onclick="location.reload()">خروج</button>
    </div>

    <!-- لوحة التحكم الكاملة -->
    <div id="screen-admin-main" class="screen admin-panel">
        <h2 style="border-bottom: 2px solid var(--primary-red); padding-bottom: 10px;">⚙️ إعدادات سهم المطور</h2>
        
        <div class="admin-section" id="admin-management-sec">
            <h4>🛡️ مصفوفة الصلاحيات وحماية الرتب</h4>
            <div style="background:#eee; padding:10px; border-radius:8px; margin-bottom:10px;">
                <input type="text" id="adm-new-name" placeholder="اسم المسؤول الجديد">
                <input type="text" id="adm-new-pass" placeholder="كلمة السر">
                <div class="perm-grid">
                    <label><input type="checkbox" id="p-all" onchange="toggleAllPerms(this)"> الكل</label>
                    <label><input type="checkbox" class="p-sub" value="ui"> المظهر</label>
                    <label><input type="checkbox" class="p-sub" value="players"> اللاعبين</label>
                    <label><input type="checkbox" class="p-sub" value="questions"> الأسئلة</label>
                    <label><input type="checkbox" class="p-sub" value="results"> النتائج</label>
                    <label><input type="checkbox" class="p-sub" value="admins"> الرتب</label>
                </div>
                <button onclick="createNewAdmin()" style="background:var(--gold); color:black; width:100%;">إضافة مسؤول جديد</button>
            </div>
            <div id="list-admins"></div>
        </div>

        <div class="admin-section" id="ui-management-sec">
            <h4>🎨 المظهر السحابي</h4>
            <input type="text" id="conf-logo" placeholder="رابط اللوجو">
            <input type="text" id="conf-bg" placeholder="رابط الخلفية">
            <input type="text" id="conf-title" placeholder="عنوان اللعبة">
            <button onclick="syncVisuals()">تحديث النظام</button>
        </div>

        <div class="admin-section" id="player-management-sec">
            <h4>👥 إدارة اللاعبين</h4>
            <div style="background:#eee; padding:10px; border-radius:8px; margin-bottom:10px;">
                <input type="text" id="p-new-name" placeholder="الاسم">
                <input type="text" id="p-new-pass" placeholder="الباسورد">
                <button onclick="addPlayer()" style="background:green; width:100%;">إضافة لاعب جديد</button>
            </div>
            <div id="list-players"></div>
        </div>

        <div class="admin-section" id="q-management-sec">
            <h4>❓ بنك الأسئلة</h4>
            <input type="text" id="q-new-text" placeholder="نص السؤال">
            <select id="q-new-type" onchange="checkQType(this.value)">
                <option value="text">نصي</option>
                <option value="options">اختيارات</option>
                <option value="camera">كاميرا 📸</option>
                <option value="draw">توقيع ✍️</option>
                <option value="audio">تسجيل صوتي 🎤</option>
            </select>
            <div id="q-options-input" style="display:none;">
                <input type="text" id="q-opt-val" placeholder="الخيارات (افصل بينها بـ ,)">
            </div>
            <button onclick="addQuestion()" style="background:blue;">إضافة للسلسلة</button>
            <div id="list-questions"></div>
        </div>

        <div class="admin-section" id="results-management-sec">
            <h4>📥 النتائج الواردة</h4>
            <div id="list-results"></div>
        </div>

        <button onclick="location.reload()" style="background:#444; width:100%;">تسجيل خروج</button>
    </div>
</div>

<div class="floating-admin-btn" onclick="showScreen('screen-admin-login')">⚙️</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAlykJlLJhPFldh5YLsG96AUOTV4TCnu64",
        authDomain: "syf12-a7161.firebaseapp.com",
        projectId: "syf12-a7161",
        storageBucket: "syf12-a7161.firebasestorage.app",
        messagingSenderId: "910787310144",
        appId: "1:910787310144:web:1b3e6590b248e12c5425a5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let state = JSON.parse(localStorage.getItem('sahm_db')) || {
        config: {
            logo: "https://via.placeholder.com/140",
            bg: "https://replicate.delivery/out-0.png",
            title: "لعبة الغموض",
            desc: "مرحباً بك في تحدي سهم المطور.. أجب بدقة.",
            rules: ["يمنع الكذب", "يجب تصوير الوجه بوضوح", "التوقيع إلزامي"]
        },
        admins: [{u: "admin", p: "1234", perms: ["ui", "players", "questions", "results", "admins"]}],
        players: [{u: "sahm", p: "1 2 3"}],
        questions: [
            {q: "ما هو اسمك الحقيقي؟", type: "text"},
            {q: "سجل مقطعاً صوتياً توضح فيه هدفك", type: "audio"},
            {q: "صورة شخصية للتحقق", type: "camera"}
        ],
        results: []
    };

    let currentUser = null;
    let currentAdmin = null;
    let gameIdx = 0;
    let tempAnswers = [];
    let mediaRecorder;
    let audioChunks = [];

    onSnapshot(doc(db, "siteConfig", "main"), (snap) => {
        if(snap.exists()) {
            const d = snap.data();
            if(d.bg) { document.body.style.backgroundImage = `url('${d.bg}')`; state.config.bg = d.bg; }
            if(d.logo) { document.getElementById('display-logo').src = d.logo; state.config.logo = d.logo; }
            if(d.title) { document.getElementById('tab-title').innerText = d.title; state.config.title = d.title; }
            localStorage.setItem('sahm_db', JSON.stringify(state));
        }
    });

    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.authAdmin = () => {
        const u = document.getElementById('admin-user-input').value;
        const p = document.getElementById('admin-pass-input').value;
        const admin = state.admins.find(a => a.u === u && a.p === p);
        if (admin) {
            currentAdmin = admin;
            applyPermsVisibility(admin.perms);
            window.showScreen('screen-admin-main');
            refreshAdminLists();
        } else alert("وصول غير مصرح به!");
    };

    function applyPermsVisibility(perms) {
        const mapping = { 'ui': 'ui-management-sec', 'players': 'player-management-sec', 'questions': 'q-management-sec', 'results': 'results-management-sec', 'admins': 'admin-management-sec' };
        Object.values(mapping).forEach(id => { if(document.getElementById(id)) document.getElementById(id).style.display = 'none'});
        perms.forEach(p => { if(mapping[p]) document.getElementById(mapping[p]).style.display = 'block'; });
    }

    window.updateAdmin = (index) => {
        const newU = document.getElementById(`edit-adm-u-${index}`).value;
        const newP = document.getElementById(`edit-adm-p-${index}`).value;
        const newPerms = Array.from(document.querySelectorAll(`.edit-adm-perm-${index}:checked`)).map(cb => cb.value);
        if(newU && newP) {
            state.admins[index] = { u: newU, p: newP, perms: newPerms };
            syncAndSave();
            alert("تم تحديث بيانات المسؤول");
        }
    };

    window.updatePlayer = (index) => {
        const newU = document.getElementById(`edit-p-u-${index}`).value;
        const newP = document.getElementById(`edit-p-p-${index}`).value;
        if(newU && newP) {
            state.players[index] = { u: newU, p: newP };
            syncAndSave();
            alert("تم تحديث بيانات اللاعب");
        }
    };

    window.createNewAdmin = () => {
        const u = document.getElementById('adm-new-name').value;
        const p = document.getElementById('adm-new-pass').value;
        const selected = Array.from(document.querySelectorAll('.p-sub:checked')).map(cb => cb.value);
        if(u && p) { state.admins.push({u, p, perms: selected}); syncAndSave(); }
    };

    window.toggleAllPerms = (src) => { document.querySelectorAll('.p-sub').forEach(cb => cb.checked = src.checked); };

    window.authPlayer = () => {
        const u = document.getElementById('login-user').value;
        const p = document.getElementById('login-pass').value;
        const player = state.players.find(x => x.u === u && x.p === p);
        if(player) {
            currentUser = u;
            document.getElementById('start-title').innerText = state.config.title;
            document.getElementById('start-desc').innerText = state.config.desc;
            document.getElementById('rules-content').innerHTML = state.config.rules.map(r => `<li>${r}</li>`).join('');
            window.showScreen('screen-start');
        } else alert("خطأ في البيانات");
    };

    window.initGameSession = () => { gameIdx = 0; tempAnswers = []; window.showScreen('screen-game'); renderQuestion(); };

    async function renderQuestion() {
        const q = state.questions[gameIdx];
        if(!q) { finishGame(); return; }
        document.getElementById('q-title').innerText = q.q;
        const container = document.getElementById('q-interface');
        container.innerHTML = "";
        
        if(q.type === 'text') { container.innerHTML = `<input type="text" id="ans-field" placeholder="اكتب إجابتك هنا...">`; }
        else if(q.type === 'options') {
            q.opts.forEach(opt => { container.innerHTML += `<button onclick="saveAndNext('${opt}')" style="background:#555; width:80%">${opt}</button>`; });
            document.getElementById('btn-next-q').style.display = "none";
        } else if(q.type === 'camera') {
            container.innerHTML = `<video id="video" autoplay playsinline></video><br><button onclick="capturePhoto()">📸 التقاط</button><canvas id="canvas" style="display:none;"></canvas>`;
            try { const stream = await navigator.mediaDevices.getUserMedia({video: true}); document.getElementById('video').srcObject = stream; } catch(e) { alert("يجب السماح بالكاميرا"); }
            document.getElementById('btn-next-q').style.display = "none";
        } else if(q.type === 'draw') {
            container.innerHTML = `<canvas id="sig-pad" class="signature-pad" width="300" height="200"></canvas><br><button onclick="clearPad()">مسح</button>`;
            initSignature();
        } else if(q.type === 'audio') {
            container.innerHTML = `
                <div class="audio-recorder">
                    <p id="rec-status">جاهز للتسجيل...</p>
                    <button id="btn-start-rec" onclick="startAudioRec()">🎙️ بدء التسجيل</button>
                    <button id="btn-stop-rec" onclick="stopAudioRec()" style="display:none; background:black;">🛑 إيقاف وحفظ</button>
                    <div id="audio-preview-container" style="display:none; margin-top:10px;">
                        <audio id="audio-preview" controls></audio>
                    </div>
                </div>`;
            document.getElementById('btn-next-q').style.display = "none";
        }
        if(q.type !== 'options' && q.type !== 'camera' && q.type !== 'audio') document.getElementById('btn-next-q').style.display = "inline-block";
    }

    // --- منطق الصوت ---
    window.startAudioRec = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = () => {
                    const base64Audio = reader.result;
                    document.getElementById('audio-preview').src = base64Audio;
                    document.getElementById('audio-preview-container').style.display = "block";
                    const btnSave = document.createElement('button');
                    btnSave.innerText = "اعتمد التسجيل واكمل ➔";
                    btnSave.style.background = "green";
                    btnSave.onclick = () => saveAndNext(base64Audio);
                    document.getElementById('audio-preview-container').appendChild(btnSave);
                };
            };
            mediaRecorder.start();
            document.getElementById('btn-start-rec').style.display = "none";
            document.getElementById('btn-stop-rec').style.display = "inline-block";
            document.getElementById('rec-status').innerText = "جاري التسجيل... 🔴";
        } catch (e) { alert("يجب السماح بالمايكروفون"); }
    };

    window.stopAudioRec = () => {
        mediaRecorder.stop();
        document.getElementById('btn-stop-rec').style.display = "none";
        document.getElementById('rec-status').innerText = "تم التسجيل ✅";
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
    };

    window.saveAndNext = (val) => { tempAnswers.push({question: state.questions[gameIdx].q, answer: val}); gameIdx++; renderQuestion(); };

    window.processAnswer = () => {
        const q = state.questions[gameIdx];
        let val = "";
        if(q.type === 'text') val = document.getElementById('ans-field').value;
        if(q.type === 'draw') val = document.getElementById('sig-pad').toDataURL();
        if(val.trim() === "" && q.type === 'text') { alert("الرجاء الإجابة"); return; }
        saveAndNext(val);
    };

    window.capturePhoto = () => {
        const v = document.getElementById('video');
        const c = document.getElementById('canvas');
        if(!v || !c) return;
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        const data = c.toDataURL('image/webp');
        if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
        saveAndNext(data);
    };

    async function finishGame() {
        const resultEntry = {user: currentUser, time: new Date().toLocaleString(), data: tempAnswers};
        state.results.push(resultEntry);
        try {
            await updateDoc(doc(db, "siteConfig", "results"), { allResults: arrayUnion(resultEntry) })
            .catch(async () => { await setDoc(doc(db, "siteConfig", "results"), { allResults: [resultEntry] }); });
        } catch(e) { console.log("Firebase Error", e); }
        syncAndSave();
        window.showScreen('screen-finish');
    }

    window.syncVisuals = async () => {
        state.config.logo = document.getElementById('conf-logo').value || state.config.logo;
        state.config.bg = document.getElementById('conf-bg').value || state.config.bg;
        state.config.title = document.getElementById('conf-title').value || state.config.title;
        await setDoc(doc(db, "siteConfig", "main"), { logo: state.config.logo, bg: state.config.bg, title: state.config.title });
        syncAndSave();
        alert("تم التحديث سحابياً!");
    };

    function syncAndSave() {
        localStorage.setItem('sahm_db', JSON.stringify(state));
        refreshAdminLists();
    }

    function refreshAdminLists() {
        if(document.getElementById('list-players')) {
            document.getElementById('list-players').innerHTML = state.players.map((p, i) => `
                <div class="row-item">
                    <input type="text" id="edit-p-u-${i}" value="${p.u}" placeholder="الاسم">
                    <input type="text" id="edit-p-p-${i}" value="${p.p}" placeholder="الباسورد">
                    <div class="row-controls">
                        <button onclick="updatePlayer(${i})" style="background:orange; font-size:0.8rem;">تحديث</button>
                        <button onclick="state.players.splice(${i},1);syncAndSave()" style="background:red; font-size:0.8rem;">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        if(document.getElementById('list-admins')) {
            document.getElementById('list-admins').innerHTML = state.admins.map((a, i) => `
                <div class="row-item">
                    <div><span class="admin-badge">RANK #${i+1}</span></div>
                    <input type="text" id="edit-adm-u-${i}" value="${a.u}" placeholder="اسم المسؤول">
                    <input type="text" id="edit-adm-p-${i}" value="${a.p}" placeholder="كلمة السر">
                    <div class="perm-grid">
                        ${['ui', 'players', 'questions', 'results', 'admins'].map(perm => `
                            <label><input type="checkbox" class="edit-adm-perm-${i}" value="${perm}" ${a.perms.includes(perm) ? 'checked' : ''}> ${perm}</label>
                        `).join('')}
                    </div>
                    <div class="row-controls">
                        <button onclick="updateAdmin(${i})" style="background:orange; font-size:0.8rem;">تحديث الرتبة</button>
                        <button onclick="state.admins.splice(${i},1);syncAndSave()" style="background:red; font-size:0.8rem;">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        if(document.getElementById('list-results')) {
            document.getElementById('list-results').innerHTML = state.results.map(r => `
                <div class="admin-section" style="font-size:0.8rem; text-align:right;">
                    <b>اللاعب: ${r.user}</b> | ${r.time}
                    <hr>
                    ${r.data.map(d => {
                        let content = d.answer;
                        if(d.answer.startsWith('data:image')) content = `<br><img src="${d.answer}" style="width:100px; border:1px solid red;">`;
                        else if(d.answer.startsWith('data:audio')) content = `<br><audio controls src="${d.answer}"></audio>`;
                        return `<p><b>${d.question}:</b> ${content}</p>`;
                    }).join('')}
                </div>
            `).join('');
        }
        
        if(document.getElementById('list-questions')) {
            document.getElementById('list-questions').innerHTML = state.questions.map((q, i) => `
                <div class="row-item" style="font-size:0.8rem;">
                    ${q.q} (${q.type})
                    <button onclick="state.questions.splice(${i},1);syncAndSave()" style="background:red; padding:5px;">حذف</button>
                </div>
            `).join('');
        }
    }

    window.checkQType = (v) => { document.getElementById('q-options-input').style.display = (v === 'options') ? 'block' : 'none'; };
    
    window.addPlayer = () => { 
        const u = document.getElementById('p-new-name').value;
        const p = document.getElementById('p-new-pass').value;
        if(u && p) { state.players.push({u, p}); syncAndSave(); }
    };

    window.addQuestion = () => {
        const qText = document.getElementById('q-new-text').value;
        const qType = document.getElementById('q-new-type').value;
        if(!qText) return;
        const q = {q: qText, type: qType};
        if(qType === 'options') q.opts = document.getElementById('q-opt-val').value.split(',');
        state.questions.push(q);
        syncAndSave();
    };

    function initSignature() {
        const canvas = document.getElementById('sig-pad');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        let drawing = false;
        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top };
        };
        const start = (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
        const move = (e) => { if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        const stop = () => { drawing = false; };
        canvas.onmousedown = start; canvas.onmousemove = move; window.onmouseup = stop;
        canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = stop;
    }

    window.clearPad = () => {
        const canvas = document.getElementById('sig-pad');
        if(canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    };

    document.getElementById('display-logo').src = state.config.logo;
    document.body.style.backgroundImage = `url('${state.config.bg}')`;
    document.getElementById('tab-title').innerText = state.config.title;
</script>

</body>
</html>
