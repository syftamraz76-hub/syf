<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">لعبة الغموض - نظام سهم المطور</title>
    <style>
        :root {
            --primary-red: #8B0000;
            --text-dark: #2D2D2D;
            --container-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-dark);
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: 0.5s;
        }

        .container {
            width: 95%;
            max-width: 700px;
            background: var(--container-bg);
            padding: 25px;
            border: 4px double var(--primary-red);
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            margin: 20px 0;
            z-index: 2;
            border-radius: 10px;
        }

        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border: 3px solid var(--primary-red);
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
        }

        .logo-container img { width: 100%; height: 100%; object-fit: cover; }

        .screen { display: none; text-align: center; animation: fadeIn 0.4s ease; }
        .active { display: block; }

        h1, h3 { color: var(--primary-red); margin-top: 0; }
        p { line-height: 1.6; }

        button {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px 5px;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover { filter: brightness(1.2); }

        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        .admin-panel { text-align: right; direction: rtl; max-height: 80vh; overflow-y: auto; }
        .admin-section { background: #f0f0f0; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-right: 5px solid var(--primary-red); }
        
        .user-item, .q-item { background: white; padding: 8px; margin: 5px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        .admin-btn { background: rgba(0,0,0,0.8); color: #fff; font-size: 0.8rem; position: fixed; bottom: 10px; left: 10px; padding: 10px 15px; border-radius: 50px; z-index: 100; cursor: pointer; border: 1px solid var(--primary-red); }
        
        .submission-card { background: white; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; text-align: right; }
        .submission-card img, .submission-card audio { display: block; max-width: 150px; margin-top: 10px; }

        video, canvas { width: 100%; max-width: 400px; border: 2px solid var(--primary-red); border-radius: 8px; margin: 10px 0; background: white; touch-action: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="logo-container">
        <img id="game-logo" src="https://via.placeholder.com/130" alt="Logo">
    </div>

    <!-- شاشات الدخول -->
    <div id="screen-login" class="screen active">
        <h1>تسجيل الدخول</h1>
        <input type="text" id="player-user" placeholder="اسم المستخدم">
        <input type="password" id="player-pass" placeholder="كلمة المرور">
        <button onclick="handlePlayerLogin()">دخول اللاعبين</button>
    </div>

    <div id="screen-admin-login" class="screen">
        <h1>🔐 دخول المسؤول</h1>
        <input type="text" id="admin-user-input" placeholder="اسم المستخدم للمسؤول">
        <input type="password" id="admin-pass-input" placeholder="كلمة المرور">
        <button onclick="checkAdminCredentials()" style="background: #333;">دخول اللوحة</button>
        <button onclick="showScreen('screen-login')" style="background: #999;">إلغاء</button>
    </div>

    <!-- شاشات اللعبة -->
    <div id="screen-start" class="screen">
        <h1 id="text-start-title"></h1>
        <p id="text-start-desc"></p>
        <button onclick="showScreen('screen-rules')">بدء التحدي</button>
    </div>

    <div id="screen-rules" class="screen">
        <h1>قوانين اللعبة</h1>
        <div id="rules-list"></div><br>
        <button onclick="startDynamicQuestions()">موافق، ابدأ</button>
    </div>

    <div id="screen-dynamic-q" class="screen">
        <h3 id="dynamic-q-text">السؤال؟</h3>
        <div id="dynamic-q-container"></div>
        <button id="dynamic-next-btn" style="display:none;" onclick="submitDynamicAnswer()">السؤال التالي</button>
    </div>

    <div id="screen-end" class="screen">
        <h1>تم استلام البيانات</h1>
        <p>لقد انتهيت من جميع المراحل بنجاح.</p>
    </div>

    <!-- لوحة التحكم -->
    <div id="screen-admin" class="screen admin-panel">
        <h2>⚙️ إعدادات سهم المطور</h2>
        
        <div class="admin-section" style="background: #fff3e0;">
            <h4>🎨 المظهر السحابي</h4>
            <input type="text" id="admin-logo-url" placeholder="رابط اللوجو">
            <input type="text" id="admin-bg-url" placeholder="رابط الخلفية">
            <button onclick="updateVisualsAndSync()" style="background:#ef6c00;">تحديث وحفظ سحابي</button>
        </div>

        <div class="admin-section">
            <h4>👥 إدارة اللاعبين</h4>
            <input type="text" id="new-user-name" placeholder="اسم المستخدم">
            <input type="text" id="new-user-pass" placeholder="كلمة السر">
            <button onclick="addNewUser()" style="background:green;">إضافة لاعب</button>
            <div id="admin-users-list"></div>
        </div>

        <div class="admin-section">
            <h4>❓ إدارة الأسئلة</h4>
            <input type="text" id="new-q-text" placeholder="نص السؤال">
            <select id="new-q-type" onchange="toggleAdminOptions()">
                <option value="text">كتابة نصية</option>
                <option value="options">اختيارات</option>
                <option value="camera">كاميرا</option>
                <option value="audio">صوت</option>
                <option value="draw">توقيع</option>
            </select>
            <div id="admin-options-input" style="display:none;">
                <input type="text" id="new-q-options" placeholder="الاختيارات (افصل بفاصلة ,)">
            </div>
            <button onclick="addNewQuestion()" style="background:blue;">إضافة السؤال</button>
            <div id="admin-questions-list"></div>
        </div>

        <div class="admin-section">
            <h4>📥 النتائج المستلمة</h4>
            <div id="submissionsList"></div>
        </div>

        <button onclick="location.reload()" style="background:#555; width:100%;">خروج</button>
    </div>
</div>

<div class="admin-btn" onclick="showScreen('screen-admin-login')">⚙️</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAlykJlLJhPFldh5YLsG96AUOTV4TCnu64",
        authDomain: "syf12-a7161.firebaseapp.com",
        projectId: "syf12-a7161",
        storageBucket: "syf12-a7161.firebasestorage.app",
        messagingSenderId: "910787310144",
        appId: "1:910787310144:web:1b3e6590b248e12c5425a5",
        measurementId: "G-4YG8RVN4H4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // الحالة العامة
    let config = JSON.parse(localStorage.getItem('game_config')) || {
        logo: "https://via.placeholder.com/130",
        bg: "https://replicate.delivery/xpbkg/Hj69fL3855U9Iit751P3971I1b400d4653a2b724/out-0.png",
        startTitle: "الغموض",
        startDesc: "هل أنت جاهز؟",
        rules: ["إطاعة الأوامر", "الصدق"],
        questions: [{q: "ما اسمك؟", type: "text"}],
        users: [{u: "player1", p: "123"}],
        admins: [{u: "admin", p: "1234"}]
    };

    let currentPlayer = "";
    let qIdx = 0;
    let currentResults = [];

    // وظائف النافذة (Global)
    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.handlePlayerLogin = () => {
        const u = document.getElementById('player-user').value;
        const p = document.getElementById('player-pass').value;
        const user = config.users.find(acc => acc.u === u && acc.p === p);
        if (user) { currentPlayer = u; window.showScreen('screen-start'); }
        else alert("خطأ في البيانات");
    };

    window.checkAdminCredentials = () => {
        const u = document.getElementById('admin-user-input').value;
        const p = document.getElementById('admin-pass-input').value;
        if (config.admins.some(a => a.u === u && a.p === p)) {
            window.showScreen('screen-admin');
            renderAdminLists();
        } else alert("دخول مرفوض");
    };

    window.updateVisualsAndSync = async () => {
        const logo = document.getElementById('admin-logo-url').value;
        const bg = document.getElementById('admin-bg-url').value;
        config.logo = logo; config.bg = bg;
        localStorage.setItem('game_config', JSON.stringify(config));
        await setDoc(doc(db, "siteConfig", "mainSettings"), { logo, background: bg });
        alert("تم الحفظ والمزامنة!");
    };

    // مزامنة حية
    onSnapshot(doc(db, "siteConfig", "mainSettings"), (snap) => {
        if (snap.exists()) {
            const d = snap.data();
            document.getElementById('game-logo').src = d.logo;
            document.body.style.backgroundImage = `url('${d.background}')`;
        }
    });

    // إدارة المحتوى
    window.addNewUser = () => {
        config.users.push({u: document.getElementById('new-user-name').value, p: document.getElementById('new-user-pass').value});
        saveAndRefresh();
    };

    window.addNewQuestion = () => {
        const q = document.getElementById('new-q-text').value;
        const type = document.getElementById('new-q-type').value;
        const opts = document.getElementById('new-q-options').value.split(',');
        config.questions.push({q, type, options: type==='options' ? opts : []});
        saveAndRefresh();
    };

    window.deleteUser = (i) => { config.users.splice(i, 1); saveAndRefresh(); };
    window.deleteQ = (i) => { config.questions.splice(i, 1); saveAndRefresh(); };

    function saveAndRefresh() {
        localStorage.setItem('game_config', JSON.stringify(config));
        renderAdminLists();
    }

    function renderAdminLists() {
        document.getElementById('admin-users-list').innerHTML = config.users.map((u, i) => `<div class="user-item">${u.u} <button onclick="deleteUser(${i})">حذف</button></div>`).join('');
        document.getElementById('admin-questions-list').innerHTML = config.questions.map((q, i) => `<div class="q-item">${q.q} <button onclick="deleteQ(${i})">حذف</button></div>`).join('');
        loadSubmissions();
    }

    // نظام الأسئلة
    window.startDynamicQuestions = () => { qIdx=0; currentResults=[]; window.showScreen('screen-dynamic-q'); loadNextQ(); };

    async function loadNextQ() {
        if (qIdx >= config.questions.length) { 
            let subs = JSON.parse(localStorage.getItem('submissions') || "[]");
            subs.push({player: currentPlayer, date: new Date().toLocaleString(), results: currentResults});
            localStorage.setItem('submissions', JSON.stringify(subs));
            window.showScreen('screen-end'); 
            return; 
        }
        const q = config.questions[qIdx];
        document.getElementById('dynamic-q-text').innerText = q.q;
        const cont = document.getElementById('dynamic-q-container');
        cont.innerHTML = "";
        document.getElementById('dynamic-next-btn').style.display = (q.type === 'options') ? "none" : "inline-block";

        if (q.type === 'text') cont.innerHTML = `<input type="text" id="ans-input">`;
        else if (q.type === 'options') q.options.forEach(o => cont.innerHTML += `<button onclick="nextQ('${o.trim()}')">${o}</button><br>`);
        else if (q.type === 'camera') {
            cont.innerHTML = `<video id="v" autoplay playsinline style="width:100%"></video><button onclick="snap()">📸 تصوير</button><div id="prev"></div>`;
            const s = await navigator.mediaDevices.getUserMedia({video:true});
            document.getElementById('v').srcObject = s;
        }
    }

    window.nextQ = (val) => { currentResults.push({q: config.questions[qIdx].q, a: val}); qIdx++; loadNextQ(); };
    window.submitDynamicAnswer = () => nextQ(document.getElementById('ans-input')?.value || "بدون إجابة");
    
    window.snap = () => {
        const v = document.getElementById('v');
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        const data = c.toDataURL('image/webp');
        document.getElementById('prev').innerHTML = `<img src="${data}" style="width:100px">`;
        nextQ(data);
    };

    function loadSubmissions() {
        const subs = JSON.parse(localStorage.getItem('submissions') || "[]");
        document.getElementById('submissionsList').innerHTML = subs.map(s => `
            <div class="submission-card">
                <b>${s.player}</b> - ${s.date}
                ${s.results.map(r => `<p>${r.q}: ${r.a.startsWith('data:image') ? '<img src="'+r.a+'" width="50">' : r.a}</p>`).join('')}
            </div>
        `).join('');
    }

    // البداية
    document.getElementById('game-logo').src = config.logo;
    document.body.style.backgroundImage = `url('${config.bg}')`;
    document.getElementById('text-start-title').innerText = config.startTitle;
    document.getElementById('text-start-desc').innerText = config.startDesc;
    document.getElementById('rules-list').innerHTML = config.rules.map(r => `<p>🔒 ${r}</p>`).join('');
</script>

</body>
</html>
